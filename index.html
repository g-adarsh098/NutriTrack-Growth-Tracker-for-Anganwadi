<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anganwadi Growth Monitor</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="appLoader" class="app-loader">
    <div class="loader-content">
        <h1>NutriTrack</h1>
        <div class="loader-spinner-large"></div>
        <p>Connecting to database...</p>
    </div>
</div>
<div class="header">
    <div>
        <h1>Growth Measurements</h1>
        <small id="lastUpdatedTime">Last Updated: Never</small>
    </div>
    <div class="controls">
        <input type="text" id="searchInput" placeholder="Search name or ID..." onkeyup="filterData()">
        <select id="statusFilter" onchange="filterData()">
            <option value="All">All Statuses</option>
            <option value="Normal">Normal</option>
            <option value="Underweight">Underweight</option>
            <option value="MAM">MAM</option>
            <option value="SAM">SAM</option>
        </select>
        <button class="btn-primary" onclick="openModal()">+ Add / Update Data</button>
    </div>
</div>

<div class="table-container">
    <div id="loadingState" class="state-message">
        <div class="spinner"></div>
        <p>Loading records from database...</p>
    </div>

    <div id="errorState" class="state-message" style="display: none;">
        <p class="error-text-large">❌ Connection failed. We could not reach the server.</p>
        <button class="btn-primary" onclick="loadData()">Retry Loading</button>
    </div>

    <div id="emptyState" class="state-message" style="display: none;">
        <p id="emptyStateMessage">No records found matching your search.</p>
        <button class="btn-secondary" onclick="resetFilters()">Clear Filters</button>
    </div>

    <table id="dataTable" style="display: none;">
        <thead>
            <tr>
                <th>Record ID</th>
                <th>Child Name</th>
                <th>Age (mo)</th>
                <th>Weight (kg)</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</div>

<div id="dataModal" class="modal">
    <div class="modal-content">
        <h2>Submit Measurement</h2>
        <div id="formError" class="error-text" style="display: none;"></div>
        <form id="measurementForm" onsubmit="submitForm(event)">
            
            <label>Record ID</label>
            <input type="text" id="record_id" required placeholder="e.g., REC021">
            
            <label>Child Name</label>
            <input type="text" id="child_name" required>
            
            <label>Age (Months)</label>
            <input type="number" id="age_months" required>
            
            <label>Weight (kg)</label>
            <input type="number" step="0.1" id="weight_kg">
            
            <label>Height (cm)</label>
            <input type="number" step="0.1" id="height_cm">
            
            <div class="modal-actions">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" id="saveButton" class="btn-primary">Save Data</button>
            </div>
        </form>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
